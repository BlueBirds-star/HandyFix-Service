(function () {
  var want = new URLSearchParams(location.search).get('start');
  var allowedRoles = want === 'admin' ? ['admin'] : (want === 'technicians' ? ['technician'] : null);
  if (!allowedRoles) return;
  var SB_URL = 'https://npcezxyyhgbycdekioix.supabase.co';
  var SB_KEY = 'sb_publishable_C10VfCZFkbnRve05vRn1Vw_-YJ1CRi8';
  var LANDING = 'https://handifix-service.vercel.app/';
  document.documentElement.setAttribute('data-gate', 'pending');
  function deny() { location.replace(LANDING); }
  var token = '';
  try {
    var stored = JSON.parse(localStorage.getItem('sb-npcezxyyhgbycdekioix-auth-token') || 'null');
    token = (stored && stored.access_token) || '';
  } catch (e) {}
  if (!token) return deny();
  fetch(SB_URL + '/auth/v1/user', { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + token } })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (u) {
      var role = u && u.app_metadata && u.app_metadata.role;
      if (allowedRoles.indexOf(role) === -1) return deny();
      if (role === 'technician') {
        var myId = 'w' + u.id.replace(/-/g, '').slice(0, 12);
        var meta = u.user_metadata || {};
        if (!WORKERS.some(function (w) { return w.id === myId; })) {
          WORKERS.push({ id: myId, name: meta.name || 'Technician', trade: meta.trade || 'Electrical' });
        }
        wk = myId;
      }
      window.myRole = role;
      document.documentElement.setAttribute('data-gate', 'open');
      sbPull();
      setInterval(sbPull, 15000);
      if (typeof render === 'function') render();
    })
    .catch(deny);
})();

function vAdmin(){return view==='staff'?vStaff():view==='list'?vList():view==='pays'?vPays():view==='detail'?vDetail():vDash()}
function vDash(){const c=s=>S.jobs.filter(j=>s.includes(j.status)).length,paid=S.jobs.filter(j=>j.payRef).reduce((a,j)=>a+sums(j.quote).t,0);return`<h1>Dashboard</h1><div class="st"><div class="card"><b>${S.jobs.length}</b><span class="mu">All requests</span></div><div class="card"><b>${c(['requested'])}</b><span class="mu">Need a quote</span></div><div class="card"><b>${c(['quoted'])}</b><span class="mu">Awaiting payment</span></div><div class="card"><b>${c(['assigned','enroute','onsite'])}</b><span class="mu">In the field</span></div><div class="card"><b>${c(['closed'])}</b><span class="mu">Signed off</span></div><div class="card"><b>${naira(paid)}</b><span class="mu">Paid so far</span></div></div><div class="card"><h2>Technicians</h2><p class="mu" style="margin:0">${WORKERS.length} on the team. Manage them in Staff.</p></div>`}
function vStaff(){return`<h1>Staff</h1><div class="card">${WORKERS.map((w,i)=>`<div class="row" style="margin-bottom:10px"><input value="${esc(w.name)}" aria-label="Technician name" onchange="editWorker(${i},'name',this.value)"><select aria-label="Trade" onchange="editWorker(${i},'trade',this.value)"><option ${w.trade==='Electrical'?'selected':''}>Electrical</option><option ${w.trade==='Plumbing'?'selected':''}>Plumbing</option></select><button class="b o" onclick="removeWorker(${i})">Remove</button></div>`).join('')}</div><div class="card"><h2>Add a technician</h2><div class="row"><input id="nw-name" placeholder="Full name"><input id="nw-email" type="email" placeholder="Login email"><input id="nw-pass" type="password" placeholder="Temporary password (8+)"><select id="nw-trade"><option>Electrical</option><option>Plumbing</option></select><button class="b" onclick="addWorker()">Create login</button></div></div>`}
function editWorker(i,k,v){const t=(v||'').trim();if(k==='name'&&!t)return toast('Name cannot be empty.');WORKERS[i][k]=k==='name'?t:v;saveWorkers()}
async function addWorker(){const n=$('#nw-name').value.trim(),em=$('#nw-email').value.trim(),pw=$('#nw-pass').value,tr=$('#nw-trade').value;if(!n||!em||!pw)return toast('Enter name, email and password.');let tok='';try{tok=JSON.parse(localStorage.getItem('sb-npcezxyyhgbycdekioix-auth-token')||'null').access_token||''}catch(e){}if(!tok)return toast('Sign in as admin on the home page first.');toast('Creating login…');try{const r=await fetch('/api/staff/create',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({name:n,email:em,password:pw,trade:tr})});const d=await r.json();if(!r.ok)return toast(d.error||'Could not create the technician');WORKERS.push({id:d.id,name:d.name,trade:d.trade});saveWorkers()}catch(e){toast('Server unreachable. Try again.')}}
function removeWorker(i){const w=WORKERS[i];if(S.jobs.some(j=>j.worker===w.id&&j.status!=='closed'))return toast('This technician has open jobs. Reassign them first.');WORKERS.splice(i,1);saveWorkers()}
function saveWorkers(){S.workers=WORKERS;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}toast('Saved');render()}
function eff(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}
function setTheme(t){document.documentElement.dataset.theme=t;render()}
const LANDING='https://handifix-service.vercel.app/';
function setRole(r){if(r==='customer'){location.href=LANDING;return}role=r;view=SUBS[r][0][0];render()}
function render(){const act=role==='customer'?(view==='confirm'?'request':view==='detail'?'list':view):role==='admin'?view:'jobs';
const h=role==='customer'?(view==='home'?vHome():view==='track'?vTrack():view==='pay'?vPay():view==='confirm'?vConfirm():view==='detail'?vDetail():view==='pays'?vPays():view==='list'?vList():vRequest()):role==='admin'?vAdmin():vWorker();
$('#app').innerHTML=`<header><div class="top"><img class="logo" src="${LOGO}" alt="HandyFix Service"><div class="roles">${[['customer','Home']].map(r=>`<button class="${r[0]===role?'on':''}" onclick="setRole('${r[0]}')">${r[1]}</button>`).join('')}</div><div class="seg" role="group" aria-label="Theme">${['light','dark'].map(t=>`<button class="${eff()===t?'on':''}" aria-pressed="${eff()===t}" onclick="setTheme('${t}')">${t==='light'?'Light':'Dark'}</button>`).join('')}</div></div><nav class="sub">${SUBS[role].map(s=>`<button class="${s[0]===act?'on':''}" onclick="view='${s[0]}';render()">${s[1]}</button>`).join('')}</nav></header><main>${banner()}${h}</main>${payId?modal():''}`}
const SP=new URLSearchParams(location.search);if(SP.get('start')==='request'){view='request'}else if(SP.get('start')==='emergency'){view='request';urg='Emergency'}else if(SP.get('start')==='track'){view='track'}else if(SP.get('start')==='technicians'){role='worker';view='jobs'}else if(SP.get('start')==='admin'){role='admin';view='dash'}else if(!SP.get('reference')){location.replace(LANDING)}
if(new URLSearchParams(location.search).get('reference')){view='track';track=S.last||'';setTimeout(()=>toast('Thanks. We are confirming your payment.'),300)}
render();
(async()=>{try{const d=await claude.use('db');if(!d){online='local';return render()}
const t=setTimeout(()=>{online='slow';render()},10000);
d.collection('jobs').onSnapshot(snap=>{clearTimeout(t);DB=d;online='live';
S.jobs=snap.docs.map(x=>x.data()).sort((a,b)=>b.id-a.id);synced={};S.jobs.forEach(j=>synced[j.id]=JSON.stringify(j));
S.seq=Math.max(1041,...S.jobs.map(j=>j.id));
if(!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render()},()=>{online='local';render()})}catch(e){online='local';render()}})();
</script>
</body>
</html>
