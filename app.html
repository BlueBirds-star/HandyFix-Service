.logo{height:44px;width:auto;display:block;background:#fff;border-radius:4px;padding:2px 6px}

main{max-width:920px;margin:0 auto;padding:8px 16px 48px}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.row input{flex:1;margin:0;min-width:180px}
.bd{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid var(--blueb);background:var(--mid);color:var(--bluet)}

.tbw{overflow-x:auto}.tb{width:100%;border-collapse:collapse;font-size:14px}
