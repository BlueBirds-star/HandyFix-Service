<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff sign in | HandyFix</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf8ff;color:#131b2e;font-family:system-ui,sans-serif;padding:16px;box-sizing:border-box}
.box{width:100%;max-width:360px;background:#fff;border:1px solid #c4c5d7;border-radius:8px;padding:24px;box-shadow:0 4px 12px -2px rgba(15,23,42,.08);text-align:center}
h1{font-size:22px;margin:0 0 4px}.sub{color:#434655;font-size:14px;margin:0 0 20px}
button{width:100%;padding:12px;font:inherit;font-weight:700;background:#fff;color:#131b2e;border:1px solid #747686;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
button:disabled{opacity:.6}
.err{color:#ba1a1a;font-size:14px;margin:14px 0 0;min-height:18px;word-break:break-word}
.back{display:block;text-align:center;margin-top:16px;font-size:14px;color:#1d4ed8}
</style>
</head>
<body>
<div class="box">
  <h1>Staff sign in</h1>
  <p class="sub">Technicians and admin sign in with their Google account.</p>
  <button id="gb" type="button">
    <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.5 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.3l7.8 6C12.3 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.7-4.2-13.6-9.9l-7.8 6C6.5 42.6 14.6 48 24 48z"/></svg>
    Continue with Google
  </button>
  <p class="err" id="err"></p>
  <a class="back" href="index.html">Back to home</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<script>
const SB_URL = 'https://npcezxyyhgbycdekioix.supabase.co';
const SB_KEY = 'sb_publishable_C10VfCZFkbnRve05vRn1Vw_-YJ1CRi8';
const APP_BASE = 'https://handifix-service.vercel.app/app.html';
const ROUTES = { admin: 'admin', technician: 'technicians' };
const sbClient = supabase.createClient(SB_URL, SB_KEY);
const err = document.getElementById('err');
const btn = document.getElementById('gb');

function routeFor(user) {
  const role = user && user.app_metadata && user.app_metadata.role;
  if (ROUTES[role]) {
    location.replace(APP_BASE + '?start=' + ROUTES[role]);
    return true;
  }
  err.textContent = 'This Google account has no staff access. Ask the admin to add it. Role found: ' + (role || 'none') + '.';
  return false;
}

// After Google sign-in, Supabase returns here with a session.
sbClient.auth.getSession().then(({ data }) => {
  if (data.session) {
    if (!routeFor(data.session.user)) sbClient.auth.signOut();
  }
});

btn.addEventListener('click', async () => {
  err.textContent = '';
  btn.disabled = true;
  const { error } = await sbClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: 'https://handifix-service.vercel.app/staff-login.html' },
  });
  if (error) {
    err.textContent = 'Google sign-in failed: ' + error.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
