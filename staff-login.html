<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff sign in | HandyFix</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf8ff;color:#131b2e;font-family:system-ui,sans-serif;padding:16px;box-sizing:border-box}
.box{width:100%;max-width:360px;background:#fff;border:1px solid #c4c5d7;border-radius:8px;padding:24px;box-shadow:0 4px 12px -2px rgba(15,23,42,.08)}
h1{font-size:22px;margin:0 0 4px}.sub{color:#434655;font-size:14px;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:12px}
input{display:block;width:100%;margin-top:5px;padding:10px;font:inherit;border:1px solid #cbd5e1;border-radius:4px;box-sizing:border-box}
button{width:100%;padding:11px;font:inherit;font-weight:700;background:#1d4ed8;color:#fff;border:1px solid #0037b0;border-radius:4px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#ba1a1a;font-size:14px;margin:12px 0 0;min-height:18px;word-break:break-word}
.back{display:block;text-align:center;margin-top:14px;font-size:14px;color:#1d4ed8}
</style>
</head>
<body>
<div class="box">
  <form id="lf">
    <h1>Staff sign in</h1>
    <p class="sub">Technicians and admin sign in here.</p>
    <label>Email<input id="le" type="email" autocomplete="username" required></label>
    <label>Password<input id="lp" type="password" autocomplete="current-password" required></label>
    <button id="lb" type="submit">Sign in</button>
    <p class="err" id="lerr"></p>
  </form>
  <a class="back" href="index.html">Back to home</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<script>
const SB_URL = 'https://npcezxyyhgbycdekioix.supabase.co';
const SB_KEY = 'sb_publishable_C10VfCZFkbnRve05vRn1Vw_-YJ1CRi8';
const APP_BASE = 'https://handifix-service.vercel.app/app.html';
const ROUTES = { admin: 'admin', technician: 'technicians' };
const sbClient = supabase.createClient(SB_URL, SB_KEY);
document.getElementById('lf').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('lb');
  const err = document.getElementById('lerr');
  err.textContent = '';
  btn.disabled = true;
  const { data, error } = await sbClient.auth.signInWithPassword({
    email: document.getElementById('le').value.trim(),
    password: document.getElementById('lp').value,
  });
  if (error) {
    err.textContent = 'Sign-in failed: ' + (error.message || 'unknown error') + '.';
    btn.disabled = false;
    return;
  }
  const role = data.user && data.user.app_metadata && data.user.app_metadata.role;
  if (!ROUTES[role]) {
    await sbClient.auth.signOut();
    err.textContent = 'This account does not have staff access. Role found: ' + (role || 'none') + '.';
    btn.disabled = false;
    return;
  }
  location.href = APP_BASE + '?start=' + ROUTES[role];
});
</script>
</body>
</html>
