<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technician | HandyFix</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf8ff;color:#131b2e;font-family:system-ui,sans-serif}
.box{width:100%;max-width:360px;background:#fff;border:1px solid #c4c5d7;border-radius:8px;padding:24px;box-shadow:0 4px 12px -2px rgba(15,23,42,.08)}
h1{font-size:22px;margin:0 0 4px}.sub{color:#434655;font-size:14px;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:12px}
input{display:block;width:100%;margin-top:5px;padding:10px;font:inherit;border:1px solid #cbd5e1;border-radius:4px;box-sizing:border-box}
button{width:100%;padding:11px;font:inherit;font-weight:700;background:#1d4ed8;color:#fff;border:1px solid #0037b0;border-radius:4px;cursor:pointer}
button:disabled{opacity:.6}
.err{color:#ba1a1a;font-size:14px;margin:12px 0 0;min-height:18px}
</style>
</head>
<body>
<form class="box" id="f">
  <h1>Technician sign in</h1>
  <p class="sub">Sign in with your technician account.</p>
  <label>Email<input id="email" type="email" autocomplete="username" required></label>
  <label>Password<input id="pass" type="password" autocomplete="current-password" required></label>
  <button id="go" type="submit">Sign in</button>
  <p class="err" id="err"></p>
</form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://npcezxyyhgbycdekioix.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_C10VfCZFkbnRve05vRn1Vw_-YJ1CRi8';
const REQUIRED_ROLE = 'technician';
const APP_URL = 'https://handyfix-lac.vercel.app'; // replace with your Vercel domain
const APP_START = 'technicians';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('go');
  const err = document.getElementById('err');
  err.textContent = '';
  btn.disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('pass').value,
  });
  if (error) {
    err.textContent = 'Email or password is incorrect.';
    btn.disabled = false;
    return;
  }
  const role = data.user && data.user.app_metadata && data.user.app_metadata.role;
  if (role !== REQUIRED_ROLE) {
    await sb.auth.signOut();
    err.textContent = 'This account does not have access here.';
    btn.disabled = false;
    return;
  }
  location.href = APP_URL + '?start=' + APP_START;
});
</script>
</body>
</html>
